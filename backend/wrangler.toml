name = "pathfundai-backend"
main = "src/index.ts"
compatibility_date = "2024-11-08"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "pathfundai-backend"

# KV Namespace for caching program data
# Run: wrangler kv:namespace create "PROGRAM_CACHE"
# Then add the binding_id here
# [[kv_namespaces]]
# binding = "PROGRAM_CACHE"
# id = "your-kv-namespace-id"

# D1 Database for structured data (optional)
# Run: wrangler d1 create pathfundai-db
# Then add the binding here
# [[d1_databases]]
# binding = "DB"
# database_name = "pathfundai-db"
# database_id = "your-database-id"

[vars]
# Set via: wrangler secret put GEMINI_API_KEY
# GEMINI_API_KEY = "your-api-key-here"

